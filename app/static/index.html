<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f7f5" />
    <title>HEC Scholarship Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --page: #f3f7f5;
        --surface: #ffffff;
        --surface-2: #edf5f1;
        --surface-3: #e2eee7;
        --text: #16352b;
        --muted: #668077;
        --border: #dbe7e1;
        --accent: #168465;
        --accent-strong: #0f7055;
        --accent-soft: #dff2ea;
        --shadow: 0 18px 50px rgba(31, 79, 62, 0.10);
      }
      [data-theme="dark"] {
        --page: #0b1512;
        --surface: #101e19;
        --surface-2: #172820;
        --surface-3: #21372f;
        --text: #edf8f3;
        --muted: #9eb3aa;
        --border: #2b4037;
        --accent: #67c6a5;
        --accent-strong: #91dabd;
        --accent-soft: #17382c;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 85% 12%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 22rem),
          var(--page);
        color: var(--text);
        transition: background-color .25s ease, color .25s ease;
      }
      .shell { max-width: 960px; }
      .header { border-bottom: 1px solid var(--border); }
      .surface { background: var(--surface); border: 1px solid var(--border); }
      .surface-2 { background: var(--surface-2); border: 1px solid var(--border); }
      .muted { color: var(--muted); }
      .accent { color: var(--accent); }
      .brand-mark {
        background: linear-gradient(145deg, var(--accent), var(--accent-strong));
        box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 25%, transparent);
      }
      .icon-button, .prompt-chip {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        transition: transform .16s ease, border-color .16s ease, background .16s ease;
      }
      .icon-button:hover, .prompt-chip:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }
      .prompt-chip { background: var(--surface-2); }
      .theme-switch {
        width: 66px;
        height: 36px;
        padding: 3px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        border-radius: 999px;
      }
      .theme-knob {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent);
        transition: transform .25s ease;
      }
      [data-theme="dark"] .theme-knob { transform: translateX(30px); }
      .chat-entry { animation: enter .28s ease-out both; }
      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .assistant-bubble { border-radius: 6px 22px 22px 22px; }
      .user-bubble { border-radius: 22px 6px 22px 22px; background: var(--accent); color: white; }
      .result-card { background: var(--surface); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
      .result-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }
      .country-tag { background: var(--accent-soft); color: var(--accent-strong); }
      .composer {
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }
      .field { background: var(--surface-2); color: var(--text); }
      .field::placeholder { color: var(--muted); }
      .field option { background: var(--surface); color: var(--text); }
      .search-button { background: var(--accent); color: white; }
      .search-button:hover { background: var(--accent-strong); }
      .search-button:disabled { cursor: wait; opacity: .65; }
      .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1s infinite alternate; }
      .typing-dot:nth-child(2) { animation-delay: .16s; }
      .typing-dot:nth-child(3) { animation-delay: .32s; }
      @keyframes bounce { to { opacity: .28; transform: translateY(-4px); } }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
    </style>
  </head>
  <body data-theme="light" class="min-h-screen">
    <main class="shell mx-auto flex min-h-screen flex-col px-4 pb-3 pt-5 sm:px-6">
      <header class="header flex items-center justify-between pb-4">
        <div class="flex items-center gap-3">
          <div class="brand-mark grid h-11 w-11 shrink-0 place-items-center rounded-2xl text-sm font-bold text-white">HEC</div>
          <div>
            <h1 class="text-base font-bold tracking-tight sm:text-lg">Scholarship Finder</h1>
            <p class="muted text-xs">Government opportunities through HEC</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="refreshButton" class="icon-button rounded-xl px-3 py-2 text-xs font-semibold sm:text-sm" type="button">
            <span class="sm:hidden">↻</span><span class="hidden sm:inline">Refresh</span>
          </button>
          <button id="themeToggle" class="theme-switch" type="button" aria-label="Switch to dark mode" title="Switch theme">
            <span id="themeKnob" class="theme-knob" aria-hidden="true">☀</span>
          </button>
        </div>
      </header>

      <section id="chat" class="flex-1 space-y-5 py-6" aria-live="polite">
        <div class="assistant-bubble surface chat-entry max-w-2xl px-5 py-4">
          <div class="mb-2 flex items-center gap-2">
            <span class="grid h-7 w-7 place-items-center rounded-full text-xs font-bold text-white" style="background:var(--accent)">AI</span>
            <span class="muted text-xs font-semibold">HEC Finder</span>
          </div>
          <p class="text-sm leading-6">Assalam-o-Alaikum! Choose a destination country and course level. I’ll search government-funded and HEC-linked scholarship opportunities for you.</p>
          <div class="mt-4 flex flex-wrap gap-2">
            <button class="prompt-chip rounded-full px-3 py-2 text-xs font-semibold" data-country="China" data-level="Masters">🇨🇳 China · Masters</button>
            <button class="prompt-chip rounded-full px-3 py-2 text-xs font-semibold" data-country="Germany" data-level="PhD">🇩🇪 Germany · PhD</button>
            <button class="prompt-chip rounded-full px-3 py-2 text-xs font-semibold" data-country="Turkey" data-level="Bachelors">🇹🇷 Turkey · Bachelors</button>
          </div>
        </div>
        <div id="messages" class="space-y-5"></div>
      </section>

      <form id="searchForm" class="sticky bottom-0 pb-2 pt-2">
        <div class="composer grid gap-2 rounded-2xl p-2 sm:grid-cols-[1fr_170px_auto]">
          <input id="country" name="country" class="field min-h-12 rounded-xl border-0 px-4 text-sm outline-none" placeholder="Destination country, e.g. China" required />
          <select id="courseLevel" name="courseLevel" class="field min-h-12 rounded-xl border-0 px-3 text-sm outline-none">
            <option>Bachelors</option>
            <option selected>Masters</option>
            <option>PhD</option>
          </select>
          <button id="searchButton" class="search-button min-h-12 rounded-xl px-5 text-sm font-bold" type="submit">Find scholarships →</button>
        </div>
      </form>
    </main>

    <script>
      const form = document.getElementById("searchForm");
      const messages = document.getElementById("messages");
      const refreshButton = document.getElementById("refreshButton");
      const searchButton = document.getElementById("searchButton");
      const themeToggle = document.getElementById("themeToggle");
      const themeKnob = document.getElementById("themeKnob");

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        }[char]));
      }

      function applyTheme(theme) {
        document.body.dataset.theme = theme;
        localStorage.setItem("hec-theme", theme);
        themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        themeKnob.textContent = theme === "dark" ? "☾" : "☀";
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0b1512" : "#f3f7f5";
      }

      const savedTheme = localStorage.getItem("hec-theme");
      applyTheme(savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      themeToggle.addEventListener("click", () => {
        applyTheme(document.body.dataset.theme === "dark" ? "light" : "dark");
      });

      function addUserMessage(country, level) {
        messages.insertAdjacentHTML("beforeend", `
          <div class="chat-entry ml-auto max-w-xl px-4 py-3 text-sm user-bubble">
            Find scholarships for <strong>${escapeHtml(country)}</strong> at <strong>${escapeHtml(level)}</strong> level
          </div>
        `);
      }

      function addAssistantMessage(data) {
        if (!data.results.length) {
          messages.insertAdjacentHTML("beforeend", `
            <div class="assistant-bubble surface chat-entry max-w-2xl px-5 py-4 text-sm">
              I found no exact matches in the offline cache for <strong>${escapeHtml(data.country)}</strong> at <strong>${escapeHtml(data.course_level)}</strong> level. Try another country or course level.
            </div>
          `);
          return;
        }
        const cards = data.results.map((item) => `
          <article class="result-card chat-entry rounded-2xl border p-4" style="border-color:var(--border)">
            <div class="flex flex-col justify-between gap-2 sm:flex-row">
              <h3 class="font-bold text-sm leading-5">${escapeHtml(item.title)}</h3>
              <span class="country-tag shrink-0 self-start rounded-full px-2.5 py-1 text-xs font-semibold">${escapeHtml(item.country)}</span>
            </div>
            <p class="muted mt-2 text-sm leading-6">${escapeHtml(item.description)}</p>
            <div class="mt-3 grid gap-2 text-xs sm:grid-cols-2">
              <span><strong>Levels:</strong> <span class="muted">${escapeHtml(item.course_levels.join(", "))}</span></span>
              <span><strong>Deadline:</strong> <span class="muted">${escapeHtml(item.deadline || "Check official source")}</span></span>
            </div>
            <p class="muted mt-3 text-xs leading-5">${escapeHtml(item.eligibility)}</p>
            ${item.application_url ? `<a class="accent mt-3 inline-block text-sm font-bold hover:underline" href="${escapeHtml(item.application_url)}" target="_blank" rel="noopener noreferrer">View official application →</a>` : ""}
          </article>
        `).join("");
        messages.insertAdjacentHTML("beforeend", `
          <div class="assistant-bubble surface chat-entry max-w-3xl p-4">
            <p class="mb-3 text-sm"><strong>${data.count}</strong> matching ${data.count === 1 ? "scholarship" : "scholarships"} found for ${escapeHtml(data.country)} · ${escapeHtml(data.course_level)}</p>
            <div class="space-y-3">${cards}</div>
          </div>
        `);
      }

      function addLoadingMessage() {
        const loadingId = `loading-${Date.now()}`;
        messages.insertAdjacentHTML("beforeend", `
          <div id="${loadingId}" class="assistant-bubble surface chat-entry flex max-w-sm items-center gap-3 px-4 py-3 text-sm">
            <span class="flex gap-1"><i class="typing-dot"></i><i class="typing-dot"></i><i class="typing-dot"></i></span>
            <span class="muted">Searching the catalogue</span>
          </div>
        `);
        return loadingId;
      }

      async function search(country, courseLevel) {
        addUserMessage(country, courseLevel);
        const loadingId = addLoadingMessage();
        searchButton.disabled = true;
        searchButton.textContent = "Searching...";
        try {
          const response = await fetch("/api/search", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({country, course_level: courseLevel})
          });
          if (!response.ok) throw new Error("Search failed");
          addAssistantMessage(await response.json());
        } catch (error) {
          messages.insertAdjacentHTML("beforeend", `<div class="assistant-bubble chat-entry max-w-xl border border-red-300 px-4 py-3 text-sm text-red-700" style="background:var(--surface)">The catalogue is unavailable. Please try again.</div>`);
        } finally {
          document.getElementById(loadingId)?.remove();
          searchButton.disabled = false;
          searchButton.textContent = "Find scholarships →";
          window.scrollTo({top: document.body.scrollHeight, behavior: "smooth"});
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const country = document.getElementById("country").value.trim();
        if (country) search(country, document.getElementById("courseLevel").value);
      });

      document.querySelectorAll(".prompt-chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          document.getElementById("country").value = chip.dataset.country;
          document.getElementById("courseLevel").value = chip.dataset.level;
          search(chip.dataset.country, chip.dataset.level);
        });
      });

      refreshButton.addEventListener("click", async () => {
        refreshButton.disabled = true;
        refreshButton.textContent = "↻";
        try {
          const response = await fetch("/api/refresh", {method: "POST"});
          const data = await response.json();
          messages.insertAdjacentHTML("beforeend", `<div class="assistant-bubble surface chat-entry max-w-xl px-4 py-3 text-sm">${escapeHtml(data.message)}</div>`);
        } catch (error) {
          messages.insertAdjacentHTML("beforeend", `<div class="assistant-bubble chat-entry max-w-xl border border-red-300 px-4 py-3 text-sm text-red-700" style="background:var(--surface)">Refresh failed and no update was applied.</div>`);
        } finally {
          refreshButton.disabled = false;
          refreshButton.innerHTML = '<span class="sm:hidden">↻</span><span class="hidden sm:inline">Refresh</span>';
          window.scrollTo({top: document.body.scrollHeight, behavior: "smooth"});
        }
      });
    </script>
  </body>
</html>
